name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # cùng bản với Streamlit Cloud
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobmarket-vn .
      - name: Smoke test
        run: |
          docker run -d -p 8501:8501 --name app jobmarket-vn
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
